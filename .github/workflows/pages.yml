name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build empv.it release
        env:
          VITE_SITE_ORIGIN: "https://empv.it"
          VITE_SITE_BASE_PATH: ""
          VITE_ENABLE_BACKGROUND_LAB: "false"
        run: |
          npx tsc -b
          npx vite build --base=/
          node scripts/seo-build.mjs
          printf "empv.it\n" > dist/CNAME
          touch dist/.nojekyll

      - name: Assert Pages artifact targets empv.it
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          grep -q "https://empv.it/it/" dist/it/index.html
          grep -q 'data-prerendered="true"' dist/it/index.html
          grep -q 'application/ld+json' dist/it/index.html
          test -f dist/llms.txt
          test -f dist/favicon-96x96.png
          grep -q 'href="/favicon-96x96.png"' dist/it/index.html
          grep -q 'name="google-site-verification" content="UnScA5DO68Suf6LYORZ-bKoSW_KV0KH6diJ9HCuVAqg"' dist/index.html
          grep -q "^# EMPV" dist/llms.txt
          grep -q 'rel="describedby" href="https://empv.it/llms.txt"' dist/it/index.html
          grep -q "https://wa.me/393792438705" dist/it/index.html
          grep -q '"logo":{"@type":"ImageObject"' dist/it/index.html
          grep -q 'class="detail-nav-back"' dist/it/progetti/commesse-posa/index.html
          grep -q 'hreflang="en"' dist/it/progetti/commesse-posa/index.html
          ! grep -R "2008hitch-afk.github.io/EMPV" dist --exclude='*.map'
          ! grep -R 'src="/EMPV/' dist/*.html dist/it dist/en 2>/dev/null
          ! grep -R 'href="/EMPV/' dist/*.html dist/it dist/en 2>/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
