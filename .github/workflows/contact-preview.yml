name: Contact path preview (temporary)

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/contact-preview.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production-style site
        env:
          VITE_SITE_ORIGIN: https://empv.it
          VITE_SITE_BASE_PATH: ""
          VITE_ENABLE_BACKGROUND_LAB: "false"
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npx vite build --base=/
          node scripts/seo-build.mjs
      - name: Install browser tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install chromium
      - name: Start preview
        run: |
          npx vite preview --base=/ --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/it/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Responsive CTA, consent and navigation smoke
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const results=[];
          for(const variant of [
            {label:'it-mobile-home',path:'/it/',w:390,h:844,mobile:true,hero:true,prompt:true},
            {label:'en-mobile-home',path:'/en/',w:390,h:844,mobile:true,hero:true,prompt:true},
            {label:'it-desktop-home',path:'/it/',w:1440,h:900,mobile:false,hero:true,prompt:true},
            {label:'it-projects-index',path:'/it/progetti/',w:390,h:844,mobile:true,hero:false,prompt:true},
            {label:'en-projects-index',path:'/en/projects/',w:1440,h:900,mobile:false,hero:false,prompt:true},
            {label:'it-project-detail',path:'/it/progetti/psicologia-operations/',w:390,h:844,mobile:true,hero:false,prompt:true},
            {label:'en-lab-detail',path:'/en/lab/trustworthy-reasoning/',w:390,h:844,mobile:true,hero:false,prompt:false},
          ]){
            const context=await browser.newContext({viewport:{width:variant.w,height:variant.h},deviceScaleFactor:1,isMobile:variant.mobile,hasTouch:variant.mobile});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173'+variant.path,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(450);
            const state=await page.evaluate(()=>{
              const prompt=document.querySelector('.contact-prompt');
              const hero=document.querySelector('.hero-contact-link');
              const links=[...document.querySelectorAll('a[data-contact-placement]')];
              return {
                hero:!!hero,
                prompt:!!prompt,
                channels:links.map(x=>({href:x.getAttribute('href'),placement:x.dataset.contactPlacement})),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                consentDialog:!!document.querySelector('.empv-cookie-consent'),
                duplicatePromptIds:document.querySelectorAll('#contact-prompt-heading').length > 1,
                scannerCanvas:document.querySelectorAll('.scanner-container canvas').length,
              };
            });
            await page.screenshot({path:'artifacts/'+variant.label+'.png',fullPage:false});
            if(variant.label.includes('home'))await page.locator('.hero-contact-link').screenshot({path:'artifacts/'+variant.label+'-cta.png'});
            results.push({...variant,expectedHero:variant.hero,expectedPrompt:variant.prompt,...state,errors});
            await context.close();
          }
          console.log(JSON.stringify(results,null,2));
          fs.writeFileSync('artifacts/results.json',JSON.stringify(results,null,2));
          await browser.close();
          if(results.some(v=>v.hero!==v.expectedHero||v.prompt!==v.expectedPrompt||v.errors.length||v.overflow||v.duplicatePromptIds||!v.consentDialog)) process.exit(1);
          if(results.some(v=>v.hero!==v.expectedHero||v.prompt!==v.expectedPrompt)) process.exit(1);
          if(results.some(v=>v.prompt && !(v.channels.some(x=>x.href.startsWith('mailto:'))&&v.channels.some(x=>x.href.startsWith('https://wa.me/')))))process.exit(1);
          if(results.some(v=>v.channels.some(x=>!x.placement)))process.exit(1);
          if(results[0].scannerCanvas!==1)process.exit(1);
          NODE
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-path-preview
          path: artifacts/
          retention-days: 7
