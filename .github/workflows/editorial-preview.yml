name: Editorial branch preview
# Global pointer preview refresh

on:
  push:
    branches:
      - editorial-copy-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build portable preview
        run: |
          npx tsc -b
          npx vite build --base=./
          cp dist/index.html dist/404.html

      - name: Publish preview build branch
        run: |
          cp -R dist /tmp/empv-preview-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-built
          git rm -rf . || true
          cp -R /tmp/empv-preview-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "Editorial preview ${GITHUB_SHA}"
          git push --force origin HEAD:preview-built
