name: Validate site changes

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/validate-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build site (no deployment)
        env:
          VITE_SITE_ORIGIN: "https://empv.it"
          VITE_SITE_BASE_PATH: ""
          VITE_ENABLE_BACKGROUND_LAB: "false"
        run: |
          npx tsc -b
          npx vite build --base=/
          node scripts/seo-build.mjs

      - name: Verify generated Italian and English pages
        run: |
          test -f dist/it/index.html
          test -f dist/en/index.html
          test -f dist/it/progetti/index.html
          test -f dist/sitemap.xml
          grep -q 'data-prerendered="true"' dist/it/index.html
          grep -q 'https://empv.it/it/' dist/it/index.html
