name: Temporary mobile Scanner shader verification

on:
  pull_request:
    paths:
      - "src/backgrounds/**"
      - ".github/workflows/mobile-scanner-motion-test.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build site
        env:
          VITE_SITE_ORIGIN: "https://empv.it"
          VITE_SITE_BASE_PATH: ""
          VITE_ENABLE_BACKGROUND_LAB: "false"
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npx vite build --base=/
          node scripts/seo-build.mjs
      - name: Install browser tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1 lighthouse@12.8.2
          npx playwright install chromium
      - name: Start local preview
        run: |
          npx vite preview --base=/ --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/it/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Verify true motion and capture mobile and desktop
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const samples=[];
          for (const test of [
            {name:'mobile',width:390,height:844,mobile:true},
            {name:'desktop',width:1440,height:900,mobile:false},
          ]) {
            const context=await browser.newContext({viewport:{width:test.width,height:test.height},isMobile:test.mobile,hasTouch:test.mobile,deviceScaleFactor:test.mobile?2:1});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/it/',{waitUntil:'networkidle',timeout:60000});
            await page.locator('.scanner-container canvas').waitFor({timeout:40000});
            await page.waitForTimeout(750);
            const canvas=page.locator('.scanner-container canvas');
            const frame1=await canvas.screenshot({path:'artifacts/'+test.name+'-frame1.png'});
            await page.waitForTimeout(1600);
            const frame2=await canvas.screenshot({path:'artifacts/'+test.name+'-frame2.png'});
            await page.screenshot({path:'artifacts/'+test.name+'-full.png',fullPage:false});
            const values=await page.evaluate(()=>{
              const canvas=document.querySelector('.scanner-container canvas');
              return {
                canvasCount:document.querySelectorAll('.scanner-container canvas').length,
                cssLiteCount:document.querySelectorAll('.scanner-mobile-lite').length,
                webgl2Available:!!canvas?.getContext('webgl2'),
                naturalCanvasWidth:canvas?.width,
                cssCanvasWidth:canvas?.getBoundingClientRect().width,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
              };
            });
            const first=crypto.createHash('sha256').update(frame1).digest('hex');
            const second=crypto.createHash('sha256').update(frame2).digest('hex');
            samples.push({...test,...values,frameChanged:first!==second,errors});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('artifacts/summary.json',JSON.stringify(samples,null,2));
          console.log(JSON.stringify(samples,null,2));
          if(samples.some(x=>x.canvasCount!==1||x.cssLiteCount!==0||!x.webgl2Available||!x.frameChanged||x.errors.length||x.overflow))process.exit(1);
          NODE
      - name: Lighthouse mobile on animated version
        continue-on-error: true
        run: |
          for n in 1 2; do
            npx lighthouse "http://127.0.0.1:4173/it/" \
              --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader" \
              --output=json \
              --output-path="artifacts/lighthouse-mobile-${n}.json" \
              --quiet
          done
      - name: Performance summary
        if: always()
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=[];
          for(const n of [1,2]) {
            const p='artifacts/lighthouse-mobile-'+n+'.json';
            if(!fs.existsSync(p))continue;
            const report=JSON.parse(fs.readFileSync(p,'utf8'));
            rows.push({run:n,performance:Math.round(report.categories.performance.score*100),tbt:report.audits['total-blocking-time']?.numericValue,lcp:report.audits['largest-contentful-paint']?.numericValue,cls:report.audits['cumulative-layout-shift']?.numericValue});
          }
          console.log(JSON.stringify(rows,null,2));
          fs.writeFileSync('artifacts/lighthouse-summary.json',JSON.stringify(rows,null,2));
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-scanner-shader-motion
          path: artifacts/
          retention-days: 7
