<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement;
        const validBackgrounds = new Set([
          "none", "particles", "aero", "beams", "threads", "waves", "galaxy",
          "orb", "silk", "sliced-waves", "side-rays", "light-tunnel",
          "scanner", "prism", "dither"
        ]);
        const validPalettes = new Set([
          "mist", "zinc", "mauve", "olive", "taupe", "amber", "blue", "indigo"
        ]);
        const aliases = { steel: "mist", sage: "olive" };

        let stored = {};
        try {
          stored = JSON.parse(localStorage.getItem("empv-visual-preferences") || "{}") || {};
        } catch {}

        const params = new URLSearchParams(location.search);
        const requestedBackground = params.get("bg");
        const requestedPalette = params.get("palette");
        const aliasedPalette = requestedPalette && aliases[requestedPalette]
          ? aliases[requestedPalette]
          : requestedPalette;

        const background = validBackgrounds.has(requestedBackground)
          ? requestedBackground
          : validBackgrounds.has(stored.background)
            ? stored.background
            : "scanner";

        const palette = validPalettes.has(aliasedPalette)
          ? aliasedPalette
          : validPalettes.has(stored.palette)
            ? stored.palette
            : "blue";

        root.dataset.visualTheme = background === "none" ? "default" : "galaxy";
        root.dataset.galaxyPalette = palette;

        try {
          const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
          const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (finePointer && !reducedMotion) {
            root.classList.add("empv-custom-cursor-enabled");
          }
        } catch {}
      })();
    </script>
    <meta name="theme-color" content="#ecebe5" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <meta name="google-site-verification" content="UnScA5DO68Suf6LYORZ-bKoSW_KV0KH6diJ9HCuVAqg" />
    <meta name="description" content="EMPV progetta software, automazioni, sistemi AI e strumenti interni partendo dai processi reali di aziende e team." />
    <title>EMPV — Sistemi digitali, automazioni e AI su misura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
